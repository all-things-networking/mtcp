# upcheck configuration — the aqua testbed.
#
# The keys and their values are the donor's running configuration, taken from
# what epserver is measured with on aqua12 (docs/DPDK_HANDOFF.md). Rule 1: the
# parameters are part of the behaviour, and they come from the donor's running
# configuration rather than from a standard or from memory.
#
# `port` names the DATA NIC. It must never be the management NIC (eno1 here) —
# rule 5. Check `ip -br link` on the node before running anything.
#
# Per-testbed, because the effort moves to CloudLab and that move should be a
# config directory rather than a port.

io = dpdk

# mTCP's own conf leaves this out and epserver sets it from `-N`, before
# mtcp_init(). upcheck has no such argument, and an unset core count builds an
# empty EAL core mask, which fails inside rte_eal_init() with a page of usage
# text and the words "Invalid 'command line' arguments".
num_cores = 1

num_mem_ch = 4
port = ens2
max_concurrency = 4096
rcvbuf = 262144
sndbuf = 262144
stat_print = ens2

# Read by the program, not by the infrastructure — a connection timeout is not
# a property of the machine (src/program/prog_id.c).
tcp_timeout = 30
tcp_timewait = 0
